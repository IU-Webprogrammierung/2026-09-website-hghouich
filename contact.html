<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="assets/js/loader.js"></script>
</head>

<body>

  <header></header>

  <main>
    <section class="contact-intro">
      <h1 class="heading1">Deine Vision. <br> Mein Skill.</h1>
      <p class="contact-me">Du hast eine Vision. Ich habe die Skills. Schreib mir und lass uns gemeinsam etwas
        Besonderes erschaffen.</p>
    </section>
    <form action="#" method="post">
      <label for="fname">Vorname</label><br>
      <input type="text" id="fname" name="fname" placeholder="Vorname" required><br>
      <label for="lname">Nachname</label><br>
      <input type="text" id="lname" name="lname" placeholder="Nachname" required><br>
      <label for="email">E-Mail Adresse</label><br>
      <input type="email" id="email" name="email" placeholder="E-Mail Adresse" required><br>
      <label for="subject">Projekt-Kategorie</label><br>

      <select id="subject" name="subject" required>
        <option value="" disabled selected>Kategorie Auswählen</option>
        <option value="UX/UI & Webdesign">UX/UI & Webdesign</option>
        <option value="Frontend Development">Frontend Development</option>
        <option value="Graphic Design & Branding">Graphic Design & Branding</option>
        <option value="3D / Motion Design">3D / Motion Design</option>
        <option value="Sonstige Anfrage">Sonstige Anfrage</option>
      </select><br>

      <label for="msg">Nachricht</label><br>
      <textarea id="msg" name="Nachricht" rows="7" cols="40" placeholder="Nachricht schreiben..."
        required></textarea><br>
      <button type="submit">Senden</button>
    </form>

    <aside>
      <h2 class="contacts-heading">Hier erreichst du mich persönlich:</h2>
      <a href="mailto:ghouichhiba@gmail.com">
        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
        ghouichhiba@gmail.com
      </a><br>
      <a href="https://www.linkedin.com/in/hiba-ghouich" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
        Hiba Ghouich
      </a><br>
      <a href="https://www.instagram.com/hiba.sstudio" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-square-instagram" aria-hidden="true"></i>
        @hiba.sstudio
      </a>
    </aside>
  </main>

  <footer></footer>

</body>

</html>
