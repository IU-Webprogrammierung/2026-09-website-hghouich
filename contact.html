<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon-4/favicon.svg" />
  <link rel="shortcut icon" href="assets/images/favicon-4/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon-4/apple-touch-icon.png" />
  <link rel="manifest" href="assets/images/favicon-4/web-app-manifest-512x512.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="assets/js/loader.js"></script>
  <script src="assets/js/theme-toggle.js"></script>
</head>

<body class="page-contact">

  <header class="site-header"></header>

  <main class="wrapper">

    <img src="assets/decor-elements/heading-arch/Desktop/Group 15.svg" class="heading-arch" aria-hidden="true">

    <h1 class="heading1">
      <span>Deine Vision.</span>
      <span>Mein Skill.</span>
    </h1>

    <p class="contact-me">Du hast eine Vision. Ich habe die Skills. Schreib mir und lass uns gemeinsam etwas
      Besonderes erschaffen.</p>


    <div class="contact-grid">
      <form action="#" method="post">
        <div class="name-row">

          <div class="field">
            <label for="fname">Vorname</label>
            <input type="text" id="fname" name="fname" placeholder="Vorname" required>
          </div>

          <div class="field">
            <label for="lname">Nachname</label>
            <input type="text" id="lname" name="lname" placeholder="Nachname" required>
          </div>
        </div>

        <div class="field">
          <label for="email">E-Mail Adresse</label>
          <input type="email" id="email" name="email" placeholder="E-Mail Adresse" required>
        </div>

        <div class="field">
          <label for="subject">Projekt-Kategorie</label>
          <select id="subject" name="subject" required>
            <option value="" disabled selected>Kategorie Auswählen</option>
            <option value="UX/UI & Webdesign">UX/UI & Webdesign</option>
            <option value="Frontend Development">Frontend Development</option>
            <option value="Graphic Design & Branding">Graphic Design & Branding</option>
            <option value="3D / Motion Design">3D / Motion Design</option>
            <option value="Sonstige Anfrage">Sonstige Anfrage</option>
          </select>
        </div>


        <div class="field">
          <div class="msg-box-btn">
            <label class="send-msg" for="msg">Nachricht</label>
            <textarea id="msg" name="Nachricht" rows="7" cols="40" placeholder="Nachricht schreiben..."
              required></textarea>
          <button class="btn btn-primary" type="submit">Senden</button>
        </div>
        </div>

      </form>

      <aside>

        <div class="personal-contact">

          <h2 class="contacts-heading">
            <span>Hier erreichst du</span>
            <span>mich persönlich:</span>
          </h2>

          <a href="mailto:ghouichhiba@gmail.com">
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            <span>ghouichhiba@gmail.com</span>
          </a>
          <a href="https://www.linkedin.com/in/hiba-ghouich" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
            <span>Hiba Ghouich</span>
          </a>
          <a href="https://www.instagram.com/hiba.sstudio" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-square-instagram" aria-hidden="true"></i>
            <span>@hiba.sstudio</span>
          </a>
        </div>

      </aside>
    </div>
  </main>

  <footer class="wrapper"></footer>

</body>

</html>
